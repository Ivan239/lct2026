server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        client_max_body_size 64m;
    }

    # Превью слайдов и скачивание .pptx/.pdf/.html отдаёт бэкенд по /static/:
    # без этого блока SPA-фолбэк ниже возвращал бы index.html вместо файлов.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
